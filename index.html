<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ob-havo Dasturi</title>
    <!-- CSS ulash -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <!-- Asosiy fon qutisi -->
    <div class="card">
        
        <!-- Qidiruv qismi -->
        <div class="search">
            <input type="text" placeholder="Shahar nomini kiriting" spellcheck="false">
            <button><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <!-- Xatolik xabari (boshida yashirin turadi) -->
        <div class="error">
            <p>Noto'g'ri shahar nomi!</p>
        </div>

        <!-- Ob-havo qismi -->
        <div class="weather">
            <img class="weather-icon" src="images/rain.png" alt="Ob-havo">
            <h1 class="temp">22°c</h1>
            <p class="city">Toshkent</p>
            
            <div class="details">
                <div class="col">
                    <img src="images/humidity.png" alt="Namlik">
                    <div>
                        <p class="humidity">50%</p>
                        <p>Namlik</p>
                    </div>
                </div>
                <div class="col">
                    <img src="images/wind.png" alt="Shamol">
                    <div>
                        <p class="wind">15 km/h</p>
                        <p>Shamol tezligi</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- JavaScript ulash -->
    <script src="script.js"></script>
</body>
</html>
